<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Ansilum</title>
    <meta name="title" content="Ansilum" />
    <meta
      name="description"
      content="Catat penjualan, kelola usaha, dan pahami angka Anda bersama Ansilum."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ansilum" />
    <meta
      property="og:description"
      content="Catat penjualan, kelola usaha, dan pahami angka Anda bersama Ansilum."
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Ansilum" />
    <meta
      property="twitter:description"
      content="Catat penjualan, kelola usaha, dan pahami angka Anda bersama Ansilum."
    />

    <meta name="theme-color" content="#FFFFFF" />

    <!-- Midtrans Snap.js for credit card payments -->
    <script
      src="https://app.sandbox.midtrans.com/snap/snap.js"
      data-client-key="__MIDTRANS_CLIENT_KEY__"
    ></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
